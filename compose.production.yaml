services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    env_file:
      - .env.production
    restart: "no"

  api:
    container_name: fintech-platform-api
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env.production
    ports:
      - "${PORT:-5000}:5000"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
